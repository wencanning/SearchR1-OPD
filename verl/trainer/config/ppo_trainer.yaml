data:
  tokenizer: null
  train_files: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  # Optional exact-match filter on the parquet data_source column.
  train_data_source: null
  val_data_source: null
  train_data_num: null
  val_data_num: null
  prompt_key: prompt
  max_prompt_length: 512
  max_response_length: 512
  max_start_length: 256
  max_obs_length: 512
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  shuffle_train_dataloader: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: ~/models/deepseek-llm-7b-chat
    external_lib: null
    attn_implementation: flash_attention_2
    override_config: { }
    enable_gradient_checkpointing: False
    use_remove_padding: False
  actor:
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: 64
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    state_masking: False
    clip_ratio: 0.2
    # Optional asymmetric PPO clipping. Null values fall back to clip_ratio.
    clip_ratio_low: null
    clip_ratio_high: null
    # Dual-clip bound for negative advantages. Must be greater than 1.
    clip_ratio_c: 3.0
    entropy_coeff: 0.001
    use_kl_loss: False # True for GRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      fsdp_size: -1
  ref:
    # Optional independent teacher checkpoint. Defaults to actor model.path.
    model_path: null
    # Evidence interventions require sdpa so a per-sample 4D additive mask is honored.
    attn_implementation: flash_attention_2
    # Strict ER/control launchers override all three precision settings to FP32.
    target_forward_dtype: bfloat16
    # Non-FP32 target logits are an explicit speed/precision tradeoff. ER
    # residual construction and vocabulary normalization still run in FP32.
    allow_approximate_target_precision: False
    # Exact target-path optimizations. Selection skips LM-head rows excluded by
    # loss_mask; trimming removes only prompt columns padded for the whole batch.
    target_select_policy_logits: True
    target_trim_shared_prompt_padding: True
    # A100 TensorFloat-32 acceleration for FP32 teacher matrix multiplications.
    # Output logits and ER normalization remain FP32.
    allow_tf32: False
    fsdp_config:
      model_dtype: null
      param_offload: False
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: fp32
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
  rollout:
    name: vllm
    temperature: 1.0
    seed: null
    # Intervened OPD targets require sampling only from tokenizer-defined IDs.
    restrict_to_tokenizer_vocab: False
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 0.95
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 1024
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    n_agent: 1 # different here used for agent tasks only

critic:
  strategy: fsdp
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  model:
    path: ~/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: False
    use_remove_padding: False
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: 64
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    fsdp_config:
      min_num_params: 0
      param_offload: False
  micro_batch_size: 64
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  structure_format_score: 0
  final_format_score: 0
  retrieval_score: 0

retriever:
  url: "http://127.0.0.1:8000/retrieve"
  topk: 3

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  opd:
    # token: distill each sampled token; sequence: use future cumulative K1 signal
    advantage_mode: token
    normalize: False
    clip_value: null
    distillation_coef: 1.0
    # Fixed coefficient used by evidence_residual and entropy_matched targets.
    # Null preserves distillation_coef for existing OPD configurations.
    lambda_distill: null
    # observed: ordinary teacher; evidence_residual: softmax(2*z_obs-z_hidden);
    # entropy_matched: softmax(z_obs/tau) with one pre-calibrated global tau.
    teacher_target: observed
    entropy_matched_tau: null
    target_token_chunk_size: 16
    # Set > 0 to add group-normalized Search-R1 outcome reward to OPD.
    grpo_reward_coef: 0.0
    # Gate token-level distillation by task advantage for OPD+RL.
    use_gated_distillation: true
    gamma: 1.0
    beta_min: 0.0
    beta_max: 0.05
    # Retrieval-Conditioned Entropy-gated OPD. Disabled by default.
    rce:
      enable: false
      entropy_normalization: percentile_rank  # percentile_rank, robust_minmax, none
      w_min: 0.1
      w_max: 1.0
      alpha: 4.0
      tau: 0.0
      default_retrieval_hit: 0.5
      eps: 1.0e-8
    diagnostics:
      enable: false
      output_dir: null
      every_n_steps: 1
      max_sequences_per_step: 64
      sample_strategy: random  # random, head, entropy_top
      float_precision: 4
      include_token_text: true
      include_decoded_response: true
      top_entropy_tokens: 32
      compress: false
  no_think_rl: False
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  state_masking:
    start_state_marker: "<information>"
    end_state_marker: "</information>"

trainer:
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: ~/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  er_entropy_calibration:
    enable: False
    fraction: 0.05
    split_seed: 42
    decode_seed: 42
    data_source: hotpotqa
    entropy_tolerance: 1.0e-6
    relative_temperature_tolerance: 1.0e-8
    output_path: refine-logs/ER_ENTROPY_CALIBRATION.json

max_turns: 10
do_search: true
