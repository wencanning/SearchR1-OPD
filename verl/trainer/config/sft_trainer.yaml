data:
  train_batch_size: 64
  micro_batch_size: 4  # this is also val batch size
  train_files: data/search_sft/train.parquet
  val_files: data/search_sft/val.parquet
  prompt_key: prompt
  response_key: response
  max_length: 4096
  truncation: error
  balance_dp_token: False
  chat_template: null
model:
  partial_pretrain: Qwen/Qwen2.5-0.5B-Instruct
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: False
  trust_remote_code: False
  lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
  lora_alpha: 16  # LoRA scaling factor
  target_modules: [q_proj, v_proj]  # Target modules for LoRA adaptation
optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0

trainer:
  default_local_dir: checkpoints/search_r1_sft/qwen2.5-0.5b-instruct
  default_hdfs_dir: null
  resume_path: null
  project_name: search-r1-sft
  experiment_name: qwen2.5-0.5b-instruct
  total_epochs: 3
  total_training_steps: null
  validate_before_training: False
  logger: ['console']
  seed: 1
